name: Build KGAMER OpenNES Maze (Fast)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Setup cc65 Prebuilt Snapshot
        shell: pwsh
        run: |
          curl.exe -L -o cc65.zip "https://downloads.sourceforge.net/project/cc65/cc65-snapshot-win64.zip"
          Expand-Archive -Path "cc65.zip" -DestinationPath "."
          
          # cc65 klasörünün içindeki bin dizininin tam yolunu buluyoruz
          $cc65Bin = (Get-ChildItem -Directory -Filter "cc65*").FullName + "\bin"
          
          # GitHub PATH'ine UTF-8 formatında güvenle ekliyoruz (sorun burada çözülüyor)
          Add-Content -Path $env:GITHUB_PATH -Value "$cc65Bin" -Encoding utf8

      - name: Verify cc65 Installation
        shell: pwsh
        run: |
          cl65 --version

      - name: Build Standard NES ROM
        shell: pwsh
        run: |
          cl65 -O -t nes main_nes.c -o kgamer_open_nes_maze_nes.nes

      - name: Upload NES Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgamer_nes_rom_windows
          path: kgamer_open_nes_maze_nes.nes
