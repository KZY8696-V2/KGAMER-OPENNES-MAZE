name: Build KGAMER OpenNES Maze (Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make gcc

      - name: Clone and Build cc65
        shell: msys2 {0}
        run: |
          git clone https://github.com/cc65/cc65.git
          cd cc65
          make -j$(nproc)

      - name: Build Standard NES ROM
        shell: msys2 {0}
        run: |
          export PATH="$PWD/cc65/bin:$PATH"
          cl65 -O -t nes main_nes.c -o kgamer_open_nes_maze_nes.nes

      - name: Upload NES Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgamer_nes_rom_windows
          path: kgamer_open_nes_maze_nes.nes
