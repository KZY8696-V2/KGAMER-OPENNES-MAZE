name: Build KGAMER OpenNES Maze (Fast)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Setup cc65 Prebuilt Snapshot
        run: |
          curl.exe -L -o cc65.zip "https://sourceforge.net/projects/cc65/files/cc65-snapshot-win64.zip/download"
          Expand-Archive -Path "cc65.zip" -DestinationPath "."
          
          # Çıkan klasörün tam bin yolunu buluyoruz
          $cc65Bin = (Get-ChildItem -Directory -Filter "cc65*").FullName + "\bin"
          
          # Hem bu adım içindeki oturuma hem de GitHub ortamına kalıcı olarak ekliyoruz
          $env:PATH += ";$cc65Bin"
          echo "$cc65Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify cc65 Installation
        run: |
          cl65 --version

      - name: Build Standard NES ROM
        run: |
          cl65 -O -t nes main_nes.c -o kgamer_open_nes_maze_nes.nes

      - name: Upload NES Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kgamer_nes_rom_windows
          path: kgamer_open_nes_maze_nes.nes
